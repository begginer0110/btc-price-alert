name: BTC 가격 급변동 알림

on:
  schedule:
    - cron: '*/15 * * * *'   # 15분마다 (UTC 기준, GitHub 부하 시 수 분 지연될 수 있음)
  workflow_dispatch: {}       # Actions 탭에서 수동 실행(테스트)용

permissions:
  contents: write   # state.json 커밋을 위해 필요

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: 가격 체크 및 알림
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 재배포 없이 조정하려면 아래 두 값만 바꾸면 됨
          WINDOW_MIN: '60'
          THRESHOLD_PCT: '2.5'
        run: python price_alert.py

      - name: 상태 커밋 (다음 실행이 이어받을 기준가 저장)
        run: |
          git config user.name "price-alert-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "state update [skip ci]"
          git push
